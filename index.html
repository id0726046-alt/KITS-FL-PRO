<!DOCTYPE html>
<html lang="es">
<head>

<title>KITS FL PRO</title>

<style>

body{

header{

}

}

.card{

}

button{

}

.menu{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 display:flex;
 justify-content:space-around;
 padding:10px;
}

.menu button{
 color:white;
 font-size:12px;
}

.hidden{

input{

</head>

</div>

</div>

<div class="menu">
