<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KITS FL PRO</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
    }

    header {
      padding: 20px;
      background: #161b22;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .buscador {
      margin: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      box-sizing: border-box;
    }

    button {
      background: white;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .contenedor {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .kit {
      background: #161b22;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .kit img {
      max-width: 100%;
      max-height: 220px;
      display: block;
      margin: 10px auto;
    }

    .escudo {
      width: 70px !important;
      height: 70px;
      object-fit: contain;
    }

    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #161b22;
      padding: 8px;
      gap: 5px;
    }

    .menu button {
      margin: 0;
      font-size: 12px;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ KITS FL PRO</h1>
  <p>Kits de fútbol</p>
</header>

<div class="contenedor">

  <section id="inicio">
    <input id="buscar" placeholder="🔎 Buscar equipo o liga..." oninput="mostrarKits()">

    <h2>🆕 Kits</h2>

    <div id="listaKits"></div>
  </section>


  <section id="agregar" class="oculto">

    <h2>➕ Agregar kit</h2>

    <input id="equipo" placeholder="Nombre del equipo">

    <input id="liga" placeholder="Liga">

    <select id="tipo">
      <option>Local</option>
      <option>Visitante</option>
      <option>Tercera</option>
      <option>Portero</option>
    </select>

    <input id="camiseta" placeholder="🔗 Link de la camiseta">

    <input id="escudo" placeholder="🔗 Link del escudo">

    <button onclick="agregarKit()">💾 Guardar kit</button>

  </section>

</div>


<div class="menu">

  <button onclick="mostrarSeccion('inicio')">
    🏠 Inicio
  </button>

  <button onclick="mostrarSeccion('agregar')">
    ➕ Agregar
  </button>

</div>


<script>

let kits = JSON.parse(localStorage.getItem("kitsFLPRO")) || [];


function guardar() {
  localStorage.setItem("kitsFLPRO", JSON.stringify(kits));
}


function agregarKit() {

  const equipo = document.getElementById("equipo").value;
  const liga = document.getElementById("liga").value;
  const tipo = document.getElementById("tipo").value;
  const camiseta = document.getElementById("camiseta").value;
  const escudo = document.getElementById("escudo").value;

  if (!equipo || !liga || !camiseta || !escudo) {
    alert("Completa todos los campos.");
    return;
  }

  kits.push({
    equipo,
    liga,
    tipo,
    camiseta,
    escudo
  });

  guardar();

  alert("✅ Kit agregado correctamente.");

  document.getElementById("equipo").value = "";
  document.getElementById("liga").value = "";
  document.getElementById("camiseta").value = "";
  document.getElementById("escudo").value = "";

  mostrarKits();
  mostrarSeccion("inicio");
}


function mostrarKits() {

  const lista = document.getElementById("listaKits");

  const busqueda =
    document.getElementById("buscar").value.toLowerCase();

  lista.innerHTML = "";

  kits
    .filter(k =>
      k.equipo.toLowerCase().includes(busqueda) ||
      k.liga.toLowerCase().includes(busqueda)
    )
    .forEach((kit, index) => {

      lista.innerHTML += `

        <div class="kit">

          <h3>${kit.equipo}</h3>

          <p>${kit.liga} · ${kit.tipo}</p>

          <img
            class="escudo"
            src="${kit.escudo}"
            alt="Escudo"
          >

          <img
            src="${kit.camiseta}"
            alt="Camiseta"
          >

          <button onclick="eliminarKit(${index})">
            🗑️ Eliminar
          </button>

        </div>

      `;

    });
}


function eliminarKit(index) {

  if (confirm("¿Quieres eliminar este kit?")) {

    kits.splice(index, 1);

    guardar();

    mostrarKits();

  }

}


function mostrarSeccion(seccion) {

  document.getElementById("inicio")
    .classList.add("oculto");

  document.getElementById("agregar")
    .classList.add("oculto");

  document.getElementById(seccion)
    .classList.remove("oculto");

}


mostrarKits();

</script>

</body>
  </html>
